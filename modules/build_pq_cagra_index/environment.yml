---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# GPU PQ-CAGRA build. Requires an NVIDIA GPU at runtime.
# Custom CUDA graph lives in nicolas.aira::pq-cagra-adc (not stock cuVS).
channels:
  - nicolas.aira
  - conda-forge
dependencies:
  - conda-forge::python=3.12
  - conda-forge::numpy=1.26.4
  - conda-forge::cudatoolkit=11.8.0
  - nicolas.aira::pq-cagra-adc=0.1.1
