name: build_rna_graphs
description: Build an RNA graph shard from a structures TSV
keywords:
  - rna
  - secondary structure
  - graph
  - gine
tools:
  - ginfinity:
      description: Per-nucleotide RNA structure embeddings generated with a GINE encoder
      homepage: https://github.com/nicoaira/GINFINITY
      documentation: https://github.com/nicoaira/GINFINITY/tree/main/docs
      licence: ["PolyForm-Noncommercial-1.0.0", "CC-BY-NC-4.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - structures:
        type: file
        description: |
          Tab-delimited RNA table with default columns transcript_id,
          sequence, and secondary_structure. Optional start/end columns
          build one sliced graph per window. Column names, delimiter,
          and slice-context flags come from pipeline params.
        pattern: "*.{tsv,txt,csv}"
        ontologies: []

output:
  graphs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.safetensors":
          type: file
          description: Graph-shard tensors
          pattern: "*.safetensors"
          ontologies: []
      - "*.json":
          type: file
          description: Graph-shard JSON sidecar (identifiers, sequences, structures, graph_spec)
          pattern: "*.json"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nicoaira"
maintainers:
  - "@nicoaira"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/ginfinity:1.2.1--18305a26eeaa0fcb
      build_id: bd-18305a26eeaa0fcb_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/ginfinity:1.2.1--573a5f92b6b6c5be
      build_id: bd-573a5f92b6b6c5be_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/9a/9af1d5c2bf9cb29fac6bef4b49ac1c9d3bf0c0885dc4f8f3f44109e8832737bb/data
