name: build_rna_graphs
description: Build an RNA graph shard from a structures TSV
keywords:
  - rna
  - secondary structure
  - graph
  - gine
tools:
  - ginfinity:
      description: Per-nucleotide RNA structure embeddings generated with a GINE encoder
      homepage: https://github.com/nicoaira/GINFINITY
      documentation: https://github.com/nicoaira/GINFINITY/tree/main/docs
      licence: ["PolyForm-Noncommercial-1.0.0", "CC-BY-NC-4.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - structures:
        type: file
        description: |
          Tab-delimited RNA table with default columns transcript_id,
          sequence, and secondary_structure. Optional start/end columns
          build one sliced graph per window. Column names, delimiter,
          and slice-context flags come from pipeline params.
        pattern: "*.{tsv,txt,csv}"
        ontologies: []

output:
  graphs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.safetensors":
          type: file
          description: Graph-shard tensors
          pattern: "*.safetensors"
          ontologies: []
      - "*.json":
          type: file
          description: Graph-shard JSON sidecar (identifiers, sequences, structures, graph_spec)
          pattern: "*.json"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750

authors:
  - "@nicoaira"
maintainers:
  - "@nicoaira"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/ginfinity:1.2.2--4f957fe3f833bed2
      build_id: bd-4f957fe3f833bed2_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/ginfinity:1.2.2--cd35d06300b1a8e4
      build_id: bd-cd35d06300b1a8e4_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/c9/c94aa66bb7d6f358fd34bdcc02f0cd69a44ca39a2bcee482e047a7ece445174a/data
