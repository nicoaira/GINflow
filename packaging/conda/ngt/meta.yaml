{% set version = "2.3.12" %}

package:
  name: ngt
  version: {{ version }}

source:
  url: https://github.com/NGT-labs/NGT/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 1a7a821806574c04fd5f3428c9cbde4acd6f001e9c16899b4172ba733ffa2274

build:
  number: 1

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake
    - make
    - ninja
  host:
    - python
    - numpy
    - pip
    - pybind11
    - setuptools
    - libblas
    - lapack
  run:
    - python
    - numpy
    - libblas
    - liblapack
    - libopenblas
    - libgomp

test:
  imports:
    - ngtpy
  commands:
    - qbg --help
    - python -c "import ngtpy; assert hasattr(ngtpy, 'Index')"

about:
  home: https://github.com/NGT-labs/NGT
  license: Apache-2.0
  license_file: LICENSE
  summary: Nearest neighbor search with neighborhood graph and tree
  description: |
    NGT is a high-speed approximate nearest-neighbor library. This package
    includes the Python binding and the qbg command for QG and QBG indexes.

extra:
  recipe-maintainers:
    - nicolas.aira
